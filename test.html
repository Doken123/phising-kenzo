<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<title>Test API</title>
<style>
body{font-family:Arial;padding:20px;background:#111;color:#fff}
button{background:#238636;color:#fff;border:0;padding:15px 25px;font-size:16px;border-radius:8px;cursor:pointer;width:100%}
pre{background:#000;color:#0f0;padding:15px;border-radius:8px;margin-top:20px;white-space:pre-wrap;word-break:break-all;font-size:12px;min-height:200px}
</style>
</head>
<body>
<h2>Test Kirim ke API</h2>
<button onclick="test()">🚀 TEST KIRIM EMAIL</button>
<pre id="hasil">Klik tombol di atas...</pre>

<script>
function test(){
    document.getElementById("hasil").textContent = "Mengirim...";

    fetch("/api/send", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({
            email: "test@test.com",
            password: "test123",
            ip: "1.2.3.4",
            ipv6: "-",
            negara: "ID Indonesia",
            prov: "Jakarta",
            kota: "Jakarta",
            zona: "Asia/Jakarta",
            isp: "Test ISP",
            asn: "AS12345",
            zip: "12345",
            koord: "-6.2 , 106.8",
            waktu: "20-09-2026 00:16:00 WIB",
            device: "Android",
            os: "Android 11",
            browser: "Chrome 120"
        })
    })
    .then(r => r.text())
    .then(t => {
        document.getElementById("hasil").textContent = "HASIL:\n\n" + t;
    })
    .catch(e => {
        document.getElementById("hasil").textContent = "ERROR:\n\n" + e.message;
    });
}
</script>
</body>
</html>
